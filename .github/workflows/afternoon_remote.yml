name: Afternoon LinkedIn Remote Job Extract

on:
  schedule:
    # 12:00 UTC = 14:00 CEST (summer) / 13:00 CET (winter) — lun–ven, 30 min après afternoon_extract (avoids dedup race)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

env:
  PYTHON_VERSION: '3.11'

jobs:
  extract:
    name: Extract Remote Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write  # Required to commit docs/usage.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run remote job extraction pipeline
        env:
          RUN_MODE: job
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python run.py

      - name: Commit usage stats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/usage.json
          git diff --staged --quiet || git commit -m "chore: usage stats $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin master
          git push

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-remote-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Upload raw scraped data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-remote-data-${{ github.run_id }}
          path: data/
          retention-days: 7
