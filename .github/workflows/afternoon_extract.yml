name: Afternoon LinkedIn Freelance Mission Extract

on:
  schedule:
    # 11:30 UTC = 13:30 CEST (summer) / 12:30 CET (winter) — lun–ven, 2ème run quotidien (offres du matin non détectées)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI for testing

env:
  PYTHON_VERSION: '3.11'

jobs:
  extract:
    name: Extract Freelance Missions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction pipeline
        env:
          RUN_MODE: freelance
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python run.py

      - name: Commit usage stats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/usage.json
          git diff --staged --quiet || git commit -m "chore: usage stats $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin master
          git push

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Upload raw scraped data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-data-${{ github.run_id }}
          path: data/
          retention-days: 7
